<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>birthday-present v1.0.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one terminal window the viewer types into; README on top, release card below after install. Single dark look by choice. */
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --line: #30363d;
  --fg: #c9d1d9;
  --dim: #7d8590;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --blue: #58a6ff;
  --pink: #ff7bb0;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.55;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.window {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  color: var(--dim); font-size: 12px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
.bar span { margin-left: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#term {
  padding: 16px;
  min-height: 60vh;
  cursor: text;
}
#out { white-space: pre-wrap; word-break: break-word; }
.l { min-height: 1.55em; }
.p { color: var(--green); font-weight: 700; }
.path { color: var(--blue); font-weight: 700; }
.ok { color: var(--green); }
.warn { color: var(--yellow); }
.err { color: var(--red); }
.dim { color: var(--dim); }
.hash { color: var(--yellow); }
.pink { color: var(--pink); }
.h { color: var(--pink); font-weight: 700; }
.code { color: var(--blue); }
.k { color: var(--blue); } .s { color: #a5d6ff; }
.cursor {
  display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom;
  background: var(--fg); animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#form { display: flex; align-items: baseline; min-width: 0; }
#form[hidden] { display: none !important; }
#prompt { white-space: pre; flex: none; }
#cmd {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--fg); font: inherit; caret-color: var(--pink); padding: 0;
}
#cmd::placeholder { color: var(--dim); opacity: .7; }
#term:focus-within { box-shadow: inset 0 0 0 1px rgba(88,166,255,.25); }
.card {
  margin-top: 20px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  padding: 18px;
  display: grid; gap: 14px;
}
.card h1 {
  margin: 0; font-size: 20px; line-height: 1.3; text-wrap: balance;
  color: var(--pink);
}
.items { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.item {
  border: 1px solid var(--line); border-radius: 8px; padding: 14px;
  display: grid; gap: 4px; align-content: start; min-width: 0;
}
.item .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.item .big { font-size: 16px; font-weight: 700; color: var(--fg); }
.item a { color: var(--blue); }
.item a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.foot { color: var(--dim); font-size: 12px; }
/* The ticket stays black on white in every theme so scanners read the QR code. */
.ticket {
  background: #fff; color: #111; border-radius: 8px; padding: 16px;
  display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  border-left: 6px dashed var(--pink);
}
.ticket .qr { flex: none; width: 168px; max-width: 100%; }
.ticket .qr svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
.ticket .tinfo { display: grid; gap: 4px; min-width: 0; flex: 1 1 200px; }
.ticket .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #555; }
.ticket .big { font-size: 16px; font-weight: 700; }
.ticket .wallet { flex: none; width: 120px; display: grid; justify-items: center; gap: 6px; font-size: 40px; line-height: 1; }
.ticket .wallet span { font-size: 12px; line-height: 1.4; color: #555; text-align: center; }
.ticket .tcode { font-size: 13px; color: #555; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { body { font-size: 12.5px; } #term { padding: 12px; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="window">
    <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span>henrik@birthday-prod: ~/birthday-present</span></div>
    <div id="term">
      <div id="out" aria-live="polite"></div>
      <form id="form" autocomplete="off">
        <span id="prompt"></span>
        <input id="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Terminal command" placeholder="type here">
      </form>
    </div>
  </div>
  <div id="release" hidden></div>
</div>

<script>
(() => {
  const out = document.getElementById('out');
  const form = document.getElementById('form');
  const input = document.getElementById('cmd');
  const promptEl = document.getElementById('prompt');
  const term = document.getElementById('term');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PROMPT = '<span class="p">henrik@birthday-prod</span>:<span class="path">~/birthday-present</span>$ ';
  const state = { booted: false, tested: false, logged: false, installed: false, mode: 'cmd', pendingSudo: null, busy: false };
  const history = []; let hIdx = 0;

  const wait = ms => reduce ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function line(html = '') {
    const d = document.createElement('div');
    d.className = 'l';
    d.innerHTML = html;
    out.appendChild(d);
    return d;
  }
  async function print(lines, gap = 110) {
    for (const l of lines) { line(l); scrollDown(); await wait(gap); }
  }
  function scrollDown() { form.scrollIntoView({ block: 'nearest' }); }

  function setPrompt() {
    if (state.mode === 'pw') {
      promptEl.innerHTML = '<span class="dim">[sudo] password for henrik: </span>';
      input.type = 'password'; input.placeholder = 'any password works today';
    } else {
      promptEl.innerHTML = PROMPT;
      input.type = 'text'; input.placeholder = '';
    }
  }
  let justReleased = false;
  function lock(on) {
    state.busy = on; form.hidden = on;
    if (on) return;
    setPrompt();
    input.focus({ preventScroll: true });
    if (justReleased) { justReleased = false; return; }
    scrollDown();
  }

  term.addEventListener('click', () => { if (!state.busy && !window.getSelection().toString()) input.focus(); });

  input.addEventListener('keydown', e => {
    if (state.mode !== 'cmd') return;
    if (e.key === 'ArrowUp' && history.length) { e.preventDefault(); hIdx = Math.max(0, hIdx - 1); input.value = history[hIdx]; }
    if (e.key === 'ArrowDown' && history.length) { e.preventDefault(); hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || ''; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const v = input.value;
      const hit = COMPLETIONS.find(c => v && c.startsWith(v));
      if (hit) input.value = hit;
    }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (state.busy) return;
    const raw = input.value;
    input.value = '';
    if (state.mode === 'pw') {
      line('<span class="dim">[sudo] password for henrik: </span>' + '*'.repeat(Math.max(8, raw.length)));
      state.mode = 'cmd';
      const next = state.pendingSudo; state.pendingSudo = null;
      lock(true); await next(); lock(false);
      return;
    }
    line(PROMPT + esc(raw));
    const cmd = raw.trim().replace(/\s+/g, ' ');
    if (cmd) { history.push(cmd); hIdx = history.length; }
    lock(true);
    await handle(cmd);
    lock(false);
  });

  // ---------- content ----------
  const README = [
    '<span class="h"># birthday-present</span>',
    '',
    'Hi! Your present is packaged, but it is not installed yet.',
    'Our deploy policy is strict, so please follow the steps.',
    '',
    '<span class="h">## Steps</span>',
    '',
    '1. Boot the system:      <span class="code">./happy_birthday.sh</span>',
    '2. Run the test suite:   <span class="code">npm test</span>',
    '3. Review the changes:   <span class="code">git log</span>',
    '4. Install the present:  <span class="code">sudo apt install birthday-present</span>',
    '',
    '<span class="dim">Stuck? Type</span> <span class="code">help</span><span class="dim">. Tab completes, ↑ repeats.</span>',
    ''
  ];

  const COMPLETIONS = ['./happy_birthday.sh', 'npm test', 'git log', 'sudo apt install birthday-present', 'cat README.md', 'cat birthday.spec.ts', 'cat RELEASE_NOTES.json', 'help', 'ls', 'clear', 'whoami', 'date'];

  async function boot() {
    await print([
      '<span class="ok">[  OK  ]</span> Loaded kernel module: love.ko',
      '<span class="ok">[  OK  ]</span> Started morning-muesli.service',
      '<span class="ok">[  OK  ]</span> Mounted /home/henrik/age',
      '<span class="warn">[ WARN ]</span> age++ applied (37 → 38). No rollback available.',
      '<span class="ok">[  OK  ]</span> Reached target: <b>Birthday</b>',
      '',
      '<span class="dim">Next: run the tests.</span>'
    ], 280);
    state.booted = true;
  }

  async function test() {
    await print(['', '<span class="dim">&gt; birthday-present@1.0.0 test</span>', '<span class="dim">&gt; jest birthday.spec.ts</span>', ''], 160);
    await wait(400);
    await print([
      '  birthday.spec.ts',
      '    <span class="ok">✓</span> is an excellent software engineer <span class="dim">(3ms)</span>',
      '    <span class="ok">✓</span> is an even better boyfriend <span class="dim">(1ms)</span>',
      '    <span class="ok">✓</span> wants to spend time together <span class="dim">(2ms)</span>',
      '    <span class="ok">✓</span> does not like advertisements <span class="dim">(0 ads skipped)</span>',
      '    <span class="ok">✓</span> deserves a really good present <span class="dim">(0ms)</span>',
      '    <span class="err">✗</span> girlfriend is ready for a climbing trip <span class="dim">(1 ankle)</span>',
      '',
      '  <span class="ok">5 passing</span>, <span class="err">1 failing</span>',
      '',
      '  <span class="err">● girlfriend is ready for a climbing trip</span>',
      '',
      '    expect(girlfriend.ankle.hardware).toBe(<span class="s">"removed and healed"</span>)',
      '',
      '    Expected: <span class="ok">"removed and healed"</span>',
      '    Received: <span class="err">"removed, still healing"</span>',
      '',
      '    <span class="dim">Known issue. Fix in progress, ETA: a few weeks of rest.</span>',
      '    <span class="dim">Workaround for this release: indoor activities only (cinema + dinner).</span>',
      '',
      '<span class="warn">Marked as non-blocking.</span> <span class="dim">Next: review the commit history.</span>'
    ], 260);
    state.tested = true;
  }

  async function log() {
    await print([
      '<span class="hash">commit 4f2a9c1</span> <span class="ok">(HEAD -&gt; main)</span>',
      '    feat: reserve table at Eclipse Grillbar, 18:30',
      '',
      '<span class="hash">commit b7e0d33</span>',
      '    feat: book 2 seats for OV: Wild Horse Nine (cinema without ads)',
      '',
      '<span class="hash">commit 91c5e02</span>',
      '    fix: no printer available, ship present as web app',
      '',
      '<span class="hash">commit 0000001</span>',
      '    chore: love you (initial commit)',
      '',
      '<span class="dim">Looks good to me. Next: install it (you will need sudo).</span>'
    ], 140);
    state.logged = true;
  }

  async function install() {
    await print([
      'Reading package lists... Done',
      'Building dependency tree... Done',
      'The following NEW packages will be installed:',
      '  <span class="pink">cinema-ov-wild-horse-nine</span>  <span class="pink">dinner-eclipse-grillbar</span>',
      'Need to get 2 seats and 1 table. 0 B of printer ink required.',
      'Get:1 CINEMA Filmtheater [2 seats, row 1, 0 ads]',
      'Get:2 Eclipse Grillbar [1 table, 18:30]'
    ], 300);
    const d = line();
    const N = 24;
    for (let i = 0; i <= N; i++) {
      d.innerHTML = 'Unpacking [<span class="ok">' + '#'.repeat(i) + '</span>' + '.'.repeat(N - i) + '] ' + Math.round(i / N * 100) + '%';
      scrollDown();
      await wait(55);
    }
    await print([
      'Setting up birthday-present (2026.11.29) ...',
      '<span class="ok">Done.</span> 2 newly installed, 0 removed.',
      '',
      '<span class="dim">Ticket details below ↓  Release notes unlocked:</span> <span class="code">cat RELEASE_NOTES.json</span>'
    ], 300);
    state.installed = true;
    await wait(300);
    showRelease();
  }

  const NOTES = [
    '{',
    '  <span class="k">"release"</span>: <span class="s">"birthday-present v1.0.0"</span>,',
    '  <span class="k">"cinema"</span>: {',
    '    <span class="k">"film"</span>: <span class="s">"Wild Horse Nine (OV)"</span>,',
    '    <span class="k">"when"</span>: <span class="s">"Sun 29.11.2026, 16:00"</span>,',
    '    <span class="k">"where"</span>: <span class="s">"CINEMA Filmtheater"</span>,',
    '    <span class="k">"seats"</span>: <span class="s">"Row 1, seats 6–7"</span>,',
    '    <span class="k">"ads"</span>: <span class="k">0</span>',
    '  },',
    '  <span class="k">"dinner"</span>: {',
    '    <span class="k">"where"</span>: <span class="s">"Eclipse Grillbar"</span>,',
    '    <span class="k">"when"</span>: <span class="s">"Sun 29.11.2026, 18:30"</span>',
    '  },',
    '  <span class="k">"plus_one"</span>: <span class="s">"me"</span>,',
    '  <span class="k">"message"</span>: <span class="s">"Happy birthday, Henrik ❤"</span>',
    '}'
  ];

  function needBoot() { line('<span class="err">bash: system not booted.</span> Start with <span class="code">./happy_birthday.sh</span>'); }

  async function handle(cmd) {
    const c = cmd.toLowerCase();
    if (!cmd) return;

    if (['./happy_birthday.sh', 'bash happy_birthday.sh', 'sh happy_birthday.sh', 'happy_birthday.sh'].includes(c)) {
      if (state.booted) return line('<span class="dim">Already booted. Happy birthday, again.</span>');
      if (c === 'happy_birthday.sh') line('<span class="dim">(Treating that as ./happy_birthday.sh, it is your birthday.)</span>');
      return boot();
    }
    if (c === 'help') {
      return print([
        'Available commands:',
        '  <span class="code">./happy_birthday.sh</span>   boot the system',
        '  <span class="code">npm test</span>              run the test suite',
        '  <span class="code">git log</span>               review the commits',
        '  <span class="code">sudo apt install birthday-present</span>',
        '  <span class="code">ls</span>, <span class="code">cat &lt;file&gt;</span>, <span class="code">whoami</span>, <span class="code">date</span>, <span class="code">clear</span>'
      ], 40);
    }
    if (c === 'clear') { out.innerHTML = ''; return; }
    if (/^(ls -[a-z]*l[a-z]*|ll)$/.test(c)) {
      const notes = state.installed
        ? '-rw-r--r--  1 henrik staff   512 Nov 29 16:00 RELEASE_NOTES.json'
        : '<span class="dim">----------  1 root root   512 Nov 29 16:00 RELEASE_NOTES.json</span>';
      return print([
        'total 5',
        '-rw-r--r--  1 henrik staff   640 Nov 29 00:00 <b>README.md</b>',
        notes,
        '-rw-r--r--  1 henrik staff   420 Nov 29 00:00 birthday.spec.ts',
        '-rwxr-xr-x  1 henrik staff    38 Nov 29 00:00 <span class="ok">happy_birthday.sh</span>',
        '-rw-r--r--  1 henrik staff    96 Nov 29 00:00 package.json'
      ], 20);
    }
    if (c === 'ls' || c === 'ls -a' || c === 'dir') {
      return line('README.md  <span class="ok">happy_birthday.sh</span>  package.json  birthday.spec.ts  ' + (state.installed ? 'RELEASE_NOTES.json' : '<span class="dim">RELEASE_NOTES.json 🔒</span>'));
    }
    if (c === 'cat readme.md' || c === 'cat readme') return print(README, 20);
    if (c === 'cat release_notes.json') {
      if (!state.installed) return line('<span class="err">cat: RELEASE_NOTES.json: Permission denied.</span> Nice try. Install the package first.');
      return print(NOTES, 40);
    }
    if (c === 'cat birthday.spec.ts') {
      return print([
        '<span class="k">describe</span>(<span class="s">"birthday boy"</span>, () =&gt; {',
        '  <span class="k">it</span>(<span class="s">"wants to spend time together"</span>, () =&gt; {',
        '    <span class="k">expect</span>(plans.withMe).toBe(<span class="k">true</span>);',
        '  });',
        '  <span class="k">it</span>(<span class="s">"does not like advertisements"</span>, () =&gt; {',
        '    <span class="k">expect</span>(cinema.ads).toHaveLength(<span class="k">0</span>);',
        '  });',
        '  <span class="k">it</span>(<span class="s">"girlfriend is ready for a climbing trip"</span>, () =&gt; {',
        '    <span class="k">expect</span>(girlfriend.ankle.hardware).toBe(<span class="s">"removed and healed"</span>);',
        '    <span class="dim">// TODO: re-run in spring. Crag booking pending.</span>',
        '  });',
        '  <span class="dim">// … 3 more</span>',
        '});'
      ], 30);
    }
    if (c === 'cat package.json') {
      return print(['{', '  <span class="k">"name"</span>: <span class="s">"birthday-present"</span>,', '  <span class="k">"version"</span>: <span class="s">"1.0.0"</span>,', '  <span class="k">"dependencies"</span>: { <span class="k">"me"</span>: <span class="s">"^forever"</span> }', '}'], 30);
    }
    if (c === 'cat happy_birthday.sh') return print(['#!/bin/bash', 'echo "Happy birthday ❤"'], 30);
    if (c.startsWith('cat ')) return line('cat: ' + esc(cmd.slice(4)) + ': No such file or directory');
    if (c === 'whoami') return line('henrik (the birthday boy 🎂)');
    if (c === 'date') return line('Today is your day. The deploy window: Sun 29.11.2026, 16:00.');
    if (c === 'pwd') return line('/home/henrik/birthday-present');
    if (c === 'exit' || c === 'logout') return line('<span class="dim">No escape from your own birthday.</span>');
    if (c.startsWith('rm ')) return line('<span class="err">rm: Permission denied.</span> Presents are non-refundable.');
    if (/^(vim|vi|nano|emacs)\b/.test(c)) return line('<span class="dim">No editing today. Everything is already perfect.</span>');
    if (c === 'sudo' || c === 'sudo su' || c === 'sudo -i' || c === 'su') return line('Root access is reserved for birthday-present installs.');

    if (!state.booted) return needBoot();

    if (['npm test', 'npm run test', 'npm t', 'yarn test', 'pnpm test', 'jest'].includes(c)) {
      return test();
    }
    if (c.startsWith('git log')) return log();
    if (c === 'git status') {
      return print(['On branch main', 'Your present is ahead of \'origin/main\' by 1 birthday.', 'nothing to commit, working tree clean'], 40);
    }
    if (c.startsWith('git ')) return line('<span class="dim">Only read access today. Try</span> <span class="code">git log</span>');

    const isInstall = /^(sudo )?(apt|apt-get) install (ibirthday|birthday)[- ]?(present|oresent|presnt|preset)$/.test(c);
    if (isInstall) {
      if (!c.startsWith('sudo')) return line('<span class="err">E: Could not open lock file. Permission denied.</span> Are you root? (Hint: <span class="code">sudo</span>)');
      if (state.installed) return line('birthday-present is already the newest version (1.0.0).');
      if (!state.tested) return line('<span class="err">E: Refusing to deploy untested code.</span> Run <span class="code">npm test</span> first.');
      if (!state.logged) return line('<span class="err">E: Unreviewed changes.</span> Please read <span class="code">git log</span> before you deploy.');
      state.mode = 'pw';
      state.pendingSudo = install;
      return;
    }
    if (/^(sudo )?(apt|apt-get) install/.test(c)) {
      return line('E: Unable to locate package ' + esc(cmd.split(' ').pop()) + '. Did you mean <span class="code">birthday-present</span>?');
    }

    const name = esc(cmd.split(' ')[0]);
    const guess = COMPLETIONS.find(x => x.split(' ')[0].startsWith(c.slice(0, 2)) && c.length > 1);
    return line('bash: ' + name + ': command not found' + (guess ? '. Did you mean <span class="code">' + guess + '</span>?' : '. Type <span class="code">help</span>.'));
  }

  function showRelease() {
    const r = document.getElementById('release');
    r.innerHTML = `
      <div class="card">
        <h1>Happy birthday, Henrik ❤ Your present is deployed.</h1>
        <div class="items">
          <div class="item">
            <span class="tag">Cinema</span>
            <span class="big">Wild Horse Nine (OV)</span>
            <span>Sunday 29.11.2026, 16:00</span>
            <span>CINEMA Filmtheater · Row 1, seats 6–7</span>
            <span>No advertisements</span>
            <a href="https://www.google.com/maps/search/?api=1&query=48.148228,11.553167" target="_blank" rel="noopener">Open in maps</a>
          </div>
          <div class="item">
            <span class="tag">Dinner</span>
            <span class="big">Eclipse Grillbar</span>
            <span>Sunday 29.11.2026, 18:30</span>
            <span>Table for two, reserved</span>
            <a href="https://eclipse-grillbar.de/" target="_blank" rel="noopener">eclipse-grillbar.de</a>
          </div>
        </div>
        <div class="ticket">
          <div class="wallet">📲<span>Ticket is in<br>your Wallet</span></div>
          <div class="tinfo">
            <span class="tag">Your ticket · check your Wallet</span>
            <span class="big">OV: Wild Horse Nine</span>
